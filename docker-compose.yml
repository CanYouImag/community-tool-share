# 一键启动 MySQL / 后端 / 前端
# 数据库名统一为 linzu（与 backend/application.yml 及各域建表脚本一致）
services:
  db:
    image: mysql:8.0
    container_name: cts-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: linzu
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      # 顺序即执行顺序：先用户/钱包，再治理（纠纷/平台引用 t_user）
      - ./db/user-wallet.sql:/docker-entrypoint-initdb.d/01-user-wallet.sql:ro
      - ./db/community-dispute-platform.sql:/docker-entrypoint-initdb.d/02-governance.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cts-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/linzu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: linzu-demo-secret-key-change-me-32bytes
    ports:
      - '8080:8080'

  frontend:
    build: ./frontend
    container_name: cts-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
