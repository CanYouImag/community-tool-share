# 自动化构建流水线：后端 Maven 编译 + 前端 Vite 构建
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: 后端构建（JDK 17 / Maven）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 打包后端（跳过测试）
        working-directory: backend
        run: mvn -B -Dmaven.test.skip=true package

  frontend:
    name: 前端构建（Node 20 / Vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 构建前端（关闭 Mock，对接真实后端）
        working-directory: frontend
        run: npm run build
        env:
          VITE_USE_MOCK: 'false'
