server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: linzu-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/linzu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mvc:
    problemdetails:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    # 生产环境必须通过 JWT_SECRET 环境变量覆盖，长度至少 32 字节
    secret: ${JWT_SECRET:linzu-demo-secret-key-change-me-32bytes}
    expire-hours: 72
  demo:
    # 首次启动时插入演示账号；不需要时设为 false
    seed: true
    username: Starling
    password: '123456'
    nickname: Starling
    # 演示阶段实名认证直接通过；接入管理端审核后改为 false
    auto-verify-real-name: true
